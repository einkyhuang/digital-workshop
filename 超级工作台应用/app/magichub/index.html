<script>
(function(){
  if (window.electronAPI && window.electronAPI.__swBridge) return;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.swMagicHub) return;
  var storeKey=function(k){return 'magichub_settings:'+k};
  window.electronAPI={
    __swBridge:true, platform:'web',
    isSecureMode: async function(){return {secure:false};},
    openPath: async function(){return {success:false,error:'web'};},
    scanDirectory: async function(){return {success:true,files:[]};},
    saveSettings: async function(key,data){try{localStorage.setItem(storeKey(key),JSON.stringify(data));return {success:true};}catch(e){return {success:false,error:String(e)};}},
    loadSettings: async function(key){try{var raw=localStorage.getItem(storeKey(key));return {success:true,data:raw?JSON.parse(raw):null};}catch(e){return {success:false,error:String(e)};}},
    readFile: async function(){return {success:false,error:'web'};},
    writeFile: async function(){return {success:false,error:'web'};},
    selectLocalZipAndUpdate: async function(){return {success:false,error:'web'};}
  };
})();
</script>
