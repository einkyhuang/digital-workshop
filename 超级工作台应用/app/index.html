<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="超级工作台"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#111111"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/>

<meta charset="utf-8"/>
<title>超级工作台</title>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sw-sidebar" id="swSidebar">
    <div class="sw-wb-segment" id="wbSegment" role="tablist" aria-label="切换工作台"></div>
    <div class="sw-sidebar-brand">
      <div class="sw-sidebar-logo" aria-hidden="true"></div>
      <div>
        <div class="sw-sidebar-title" id="wbTitle">超级工作台</div>
        <div class="sw-sidebar-sub" id="dataSource">加载中…</div>
      </div>
    </div>
    <nav class="sw-nav" id="tabs"></nav>
    <div class="sw-sidebar-foot">
      <button type="button" class="sw-settings-btn" id="btnGlobalSettings" title="全局模型设置">
        <span class="sw-settings-gear" aria-hidden="true">⚙</span>
        <span>设置</span>
      </button>
      <div class="sw-status"><span class="dot"></span> workspace.json</div>
    </div>
  </aside>
  <div class="sw-main">
    <header class="sw-topbar">
      <div class="actions">
        <button type="button" id="btnExport">导出 JSON</button>
        <label class="import-btn">导入 JSON<input type="file" id="fileImport" accept="application/json,.json" hidden/></label>
        <button type="button" id="btnReset" class="ghost">恢复默认</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="swSettingsModal" class="sw-settings-modal" hidden>
  <div class="sw-settings-card" role="dialog" aria-modal="true" aria-label="全局模型设置">
    <div class="sw-settings-head">
      <strong>全局模型设置</strong>
      <span class="muted">与外贸工作台共用</span>
      <button type="button" id="swSettingsClose">×</button>
    </div>
    <div id="swSettingsBody" class="sw-settings-body">加载中…</div>
    <div class="sw-settings-actions">
      <button type="button" id="swSettingsSave" class="primary">保存</button>
    </div>
  </div>
</div>
<script src="assets/shared-models.js"></script>
<script src="assets/app.js"></script>
<script src="assets/agent.js"></script>
</body>
</html>
