name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync data into app
        run: |
          mkdir -p "超级工作台应用/app/data"
          cp -f "超级工作台应用/data/workspace.json" "超级工作台应用/app/data/workspace.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 超级工作台应用/app
      - id: deployment
        uses: actions/deploy-pages@v4
